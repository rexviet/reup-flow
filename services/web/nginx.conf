server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative API URLs work from localhost and other machines on the LAN.
    location ~ ^/(api|internal)/ {
        proxy_pass http://nest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: there is exactly one route today, but this keeps a
    # future client-side route (e.g. a job detail page) from 404ing on
    # refresh instead of requiring another compose/nginx change later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
