server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: there is exactly one route today, but this keeps a
    # future client-side route (e.g. a job detail page) from 404ing on
    # refresh instead of requiring another compose/nginx change later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
