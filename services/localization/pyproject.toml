[project]
name = "localization"
version = "0.1.0"
description = "Video localization service: contracts, providers, object store and Temporal guards."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-ai-slim[openai,temporal]==2.61.0",
  "temporalio[opentelemetry]==1.34.0",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.6",
  "boto3>=1.35",
  "httpx>=0.28,<0.29",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "psycopg[binary]>=3.2",
  "num2words>=0.5.14",
  "pillow>=13.0.0",
  "fonttools>=4.67.0",
  "typesafe-sdk>=0.7.2,<0.8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "moto[s3]>=5",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["live: calls real VoiceStudio / OpenRouter / MinIO; run by hand with the env set"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
